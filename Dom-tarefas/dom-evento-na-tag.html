<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo-05 - dom evento na tag</title>
    </head>
    <body onclick="clicou()">
        <main class="area">
    <h1>Exemplo 05 - Evento diretamente na tag</h1>
    <p>Clique em qualquer lugar da página.</p>
    <p>O evento foi declarado no body com <strong>onclick="clicou()"</strong>.</p>
</main>
<script>
   function clicou() {
    window.alert('Você clicou na página!');
}
</script>
    </body>

    
</html>
