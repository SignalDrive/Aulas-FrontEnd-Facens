<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom - alterando- atributos de imagem</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 40px;
            background: white;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px rgba(30, 202, 226, 0, 15);
        }

        img {
            display: block;
            margin-top: 16px;
            border-radius: 12px;
            border: 4px solid #ddd;
            transition: transform 0.4s ease;
        }

        button {
            margin-top: 16px;
            margin-right: 8px;
            padding: 10px 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #0b72b9;
            color: white;
            font-weight: #8b5cf6;
        }

        .botao-rotacionar {
            background: #222;
        }
    </style>
</head>

<body>

    <main class="card">
        <h1>exemplo-02 - alterando atributos de uma imagem</h1>
        <p>
            clique nos botoes para altera os atributos
            <strong>src</strong>, <strong>alt</strong> <strong>width</strong>
            e aplicar a rotação utilizando JS.
        </p>



        <img id="foto" src="https://picsum.photos/200/300" alt="imagem Iniciar">

        <button onclick="alterarImagem()">alterar imagem</button>
        <button class="botao-rotacionar" onclick="rotacionarImagem()">rotacionar</button>
        <button class="botao-reset" onclick="resetarImagem()">resetar imagem</button>

    </main>

    <script>
        const alterarImagem = () => {
            let imagem = document.querySelector('#foto');

            //setAttribute recebe dois paramentros
            imagem.setAttribute('src', 'https://picsum.photos/200/300?grayscale');
            imagem.setAttribute('alt', 'Imagem alterada para tons de cinza via javaScript');
            imagem.setAttribute('width', '320');
        }
        function rotacionarImagem() {
            let imagem = document.querySelector('#foto');

            // a propriedade transform permite aplicar transformações visuais
            //rotate (90deg) gira 90

            imagem.style.transform = 'rotate(90deg)';
        }

        function resetarImagem() {
            let imagem = document.querySelector('#foto');

            //retorna os atributos da imagem ao estado inicial

            imagem.setAttribute('src', 'https://picsum.photos/200/300');
            imagem.setAttribute('alt', 'imagem inicial');

            //remove o width aplicado pelo javascript
            imagem.removeAttribute('width');

            //remove a rotação aplicada pelo javascript
            imagem.style.transform = 'rotate(0deg)';
        }
    </script>

</body>

</html>
